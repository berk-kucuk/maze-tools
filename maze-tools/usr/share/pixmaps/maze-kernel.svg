<?xml version="1.0" encoding="UTF-8"?>
<!-- Maze Kernel Switcher — monochrome white CPU icon. Matches the maze-hardware
     / maze-panic house style (white line art on transparent, for the dark Maze
     panel). Distinct from maze-hardware: 3 pins per side + a nested core dot. -->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5.5" y="5.5" width="11" height="11" rx="2"/>
    <rect x="8.3" y="8.3" width="5.4" height="5.4" rx="1.2" stroke-width="1.3"/>
    <!-- pins: 3 per side -->
    <path d="M8 5.5V3M11 5.5V3M14 5.5V3M8 16.5V19M11 16.5V19M14 16.5V19M5.5 8H3M5.5 11H3M5.5 14H3M16.5 8H19M16.5 11H19M16.5 14H19"/>
  </g>
  <circle cx="11" cy="11" r="1.05" fill="#ffffff"/>
</svg>
